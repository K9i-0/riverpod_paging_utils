name: check-pr

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

      - name: Analyze package and example
        run: flutter analyze --fatal-infos

      - name: Check format
        run: sh tool/check_format.sh

      - name: Regenerate package and example
        run: dart run melos run build --no-select

      - name: Check generated code
        run: |
          git add -N .
          git diff --exit-code

      - name: Run tests
        run: flutter test --coverage

      - name: Run example smoke tests
        working-directory: example
        run: flutter test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  minimum-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up minimum supported Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      - name: Create a consumer outside the development workspace
        run: |
          consumer_dir="$RUNNER_TEMP/riverpod_paging_minimum_consumer"
          mkdir -p "$consumer_dir"
          cp -R test "$consumer_dir/test"
          cat > "$consumer_dir/pubspec.yaml" <<EOF
          name: riverpod_paging_minimum_consumer
          publish_to: none
          environment:
            sdk: ">=3.7.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            flutter_riverpod: 3.0.0
            freezed_annotation: 3.1.0
            riverpod_paging_utils:
              path: "$GITHUB_WORKSPACE"
          dev_dependencies:
            flutter_test:
              sdk: flutter
            test: ^1.25.2
          EOF

      - name: Test with minimum supported dependencies
        working-directory: ${{ runner.temp }}/riverpod_paging_minimum_consumer
        run: |
          flutter pub get
          flutter test

  patrol:
    name: Patrol iOS regression
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-application-runtime
      - name: Run the regression suite on an iPhone simulator
        run: bash tool/patrol_ios.sh
      - name: Upload Patrol diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patrol-results
          retention-days: 7
          path: |
            example/build/ios_integ/Logs/Test/*.xcresult
            example/build/*_results_*.xcresult
            example/build/patrol_results*
            example/build/patrol_logs*
          if-no-files-found: ignore
